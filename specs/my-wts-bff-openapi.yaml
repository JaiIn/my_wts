openapi: 3.1.0
info:
  title: my_wts Local BFF API
  version: 1.1.0
  description: Frozen local-authenticated, read-only Toss WTS BFF contract.
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:3000/api/v1
tags:
  - name: Auth
    description: 로컬 회원가입·로그인·로그아웃
  - name: System
    description: 로컬 상태와 진단
  - name: Market
    description: 종목·시세·시장 조회
  - name: Accounts
    description: Toss 계좌 선택
  - name: Portfolio
    description: 자산과 주문 가능 정보 조회
  - name: History
    description: 일반·조건주문 내역 조회
  - name: Simulations
    description: 실제 전송 없는 주문 계산
  - name: Watchlists
    description: 사용자별 관심종목
security:
  - cookieAuth: []
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: 로컬 서비스 상태 조회
      security: []
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/signup:
    post:
      tags: [Auth]
      operationId: signup
      summary: 로컬 사용자 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201": { $ref: "#/components/responses/UserCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 로컬 사용자 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "204": { description: Login session created }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 현재 로그인 session 폐기
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/session:
    get:
      tags: [Auth]
      operationId: getAuthSession
      summary: 현재 로그인 사용자 조회
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /capabilities:
    get:
      tags: [System]
      operationId: getCapabilities
      summary: 안전한 기능 상태 조회
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /diagnostics:
    get:
      tags: [System]
      operationId: getDiagnostics
      summary: 비밀값이 제거된 진단 조회
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /market/stocks:
    get:
      tags: [Market]
      operationId: getStocks
      summary: 종목 기본정보 조회
      parameters:
        - $ref: "#/components/parameters/Symbols"
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /market/stocks/{symbol}/warnings:
    get:
      tags: [Market]
      operationId: getStockWarnings
      summary: 종목 유의사항 조회
      parameters:
        - $ref: "#/components/parameters/SymbolPath"
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /market/prices:
    get:
      tags: [Market]
      operationId: getPrices
      summary: 현재가 조회
      parameters:
        - $ref: "#/components/parameters/Symbols"
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /market/orderbook:
    get:
      tags: [Market]
      operationId: getOrderbook
      summary: 호가 조회
      parameters:
        - $ref: "#/components/parameters/SymbolQuery"
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /market/trades:
    get:
      tags: [Market]
      operationId: getTrades
      summary: 체결 조회
      parameters:
        - $ref: "#/components/parameters/SymbolQuery"
        - name: count
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /market/price-limits:
    get:
      tags: [Market]
      operationId: getPriceLimits
      summary: 가격 제한 조회
      parameters:
        - $ref: "#/components/parameters/SymbolQuery"
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /market/candles:
    get:
      tags: [Market]
      operationId: getCandles
      summary: 종목 캔들 조회
      parameters:
        - $ref: "#/components/parameters/SymbolQuery"
        - name: interval
          in: query
          required: true
          schema: { type: string }
        - name: count
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
        - name: before
          in: query
          schema: { type: string }
        - name: adjusted
          in: query
          schema: { type: boolean, default: true }
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /market/exchange-rate:
    get:
      tags: [Market]
      operationId: getExchangeRate
      summary: 환율 조회
      parameters:
        - name: baseCurrency
          in: query
          required: true
          schema: { type: string }
        - name: quoteCurrency
          in: query
          required: true
          schema: { type: string }
        - name: dateTime
          in: query
          schema: { type: string, format: date-time }
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /market/calendars/{country}:
    get:
      tags: [Market]
      operationId: getMarketCalendar
      summary: 시장 영업일 조회
      parameters:
        - name: country
          in: path
          required: true
          schema: { type: string, enum: [KR, US] }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /market/rankings:
    get:
      tags: [Market]
      operationId: getRankings
      summary: 시장 랭킹 조회
      parameters:
        - name: marketCountry
          in: query
          required: true
          schema: { type: string, enum: [KR, US] }
        - name: type
          in: query
          required: true
          schema: { type: string }
        - name: duration
          in: query
          required: true
          schema: { type: string }
        - name: count
          in: query
          schema: { type: integer, enum: [20, 50, 100], default: 20 }
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /market/indicators/prices:
    get:
      tags: [Market]
      operationId: getIndicatorPrices
      summary: 시장지표 현재가 조회
      parameters:
        - $ref: "#/components/parameters/Symbols"
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /market/indicators/{symbol}/candles:
    get:
      tags: [Market]
      operationId: getIndicatorCandles
      summary: 시장지표 캔들 조회
      parameters:
        - $ref: "#/components/parameters/SymbolPath"
        - name: interval
          in: query
          required: true
          schema: { type: string }
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /market/indicators/{symbol}/investor-trading:
    get:
      tags: [Market]
      operationId: getInvestorTrading
      summary: 투자자별 거래 조회
      parameters:
        - $ref: "#/components/parameters/SymbolPath"
        - name: interval
          in: query
          required: true
          schema: { type: string }
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "502": { $ref: "#/components/responses/BadGateway" } }

  /accounts:
    get:
      tags: [Accounts]
      operationId: getAccounts
      summary: 마스킹 계좌 목록 조회
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /session/account:
    put:
      tags: [Accounts]
      operationId: selectAccount
      summary: 로그인 session의 Toss 계좌 선택
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelectAccountRequest" }
      responses: { "204": { description: Account selected }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "409": { $ref: "#/components/responses/Conflict" } }
    delete:
      tags: [Accounts]
      operationId: clearSelectedAccount
      summary: 로그인 session의 Toss 계좌 선택 해제
      responses: { "204": { description: Account selection cleared }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /portfolio/holdings:
    get:
      tags: [Portfolio]
      operationId: getHoldings
      summary: 보유 종목 조회
      parameters:
        - name: symbol
          in: query
          schema: { $ref: "#/components/schemas/Symbol" }
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "409": { $ref: "#/components/responses/Conflict" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /order-info/buying-power:
    get:
      tags: [Portfolio]
      operationId: getBuyingPower
      summary: 매수가능금액 조회
      parameters:
        - name: currency
          in: query
          required: true
          schema: { type: string, enum: [KRW, USD] }
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "409": { $ref: "#/components/responses/Conflict" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /order-info/sellable-quantity:
    get:
      tags: [Portfolio]
      operationId: getSellableQuantity
      summary: 매도가능수량 조회
      parameters:
        - $ref: "#/components/parameters/SymbolQuery"
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "409": { $ref: "#/components/responses/Conflict" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /order-info/commissions:
    get:
      tags: [Portfolio]
      operationId: getCommissions
      summary: 수수료 조회
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "409": { $ref: "#/components/responses/Conflict" }, "502": { $ref: "#/components/responses/BadGateway" } }

  /orders:
    get:
      tags: [History]
      operationId: getOrders
      summary: 일반 주문 내역 조회
      parameters:
        - $ref: "#/components/parameters/HistoryStatus"
        - $ref: "#/components/parameters/OptionalSymbol"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "409": { $ref: "#/components/responses/Conflict" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /orders/{orderId}:
    get:
      tags: [History]
      operationId: getOrder
      summary: 일반 주문 상세 조회
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /conditional-orders:
    get:
      tags: [History]
      operationId: getConditionalOrders
      summary: 조건주문 내역 조회
      parameters:
        - $ref: "#/components/parameters/HistoryStatus"
        - $ref: "#/components/parameters/OptionalSymbol"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "409": { $ref: "#/components/responses/Conflict" }, "502": { $ref: "#/components/responses/BadGateway" } }
  /conditional-orders/{conditionalOrderId}:
    get:
      tags: [History]
      operationId: getConditionalOrder
      summary: 조건주문 상세 조회
      parameters:
        - name: conditionalOrderId
          in: path
          required: true
          schema: { type: string }
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "502": { $ref: "#/components/responses/BadGateway" } }

  /simulations/orders:
    post:
      tags: [Simulations]
      operationId: simulateOrder
      summary: 실제 전송 없는 일반 주문 계산
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderSimulationRequest" }
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /simulations/conditional-orders:
    post:
      tags: [Simulations]
      operationId: simulateConditionalOrder
      summary: 실제 전송 없는 조건주문 검증
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConditionalSimulationRequest" }
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimulationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /watchlists:
    get:
      tags: [Watchlists]
      operationId: getWatchlists
      summary: 현재 사용자의 관심종목 목록 조회
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "401": { $ref: "#/components/responses/Unauthorized" } }
    post:
      tags: [Watchlists]
      operationId: createWatchlist
      summary: 관심종목 목록 생성
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchlistRequest" }
      responses: { "201": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /watchlists/{watchlistId}:
    patch:
      tags: [Watchlists]
      operationId: updateWatchlist
      summary: 관심종목 목록 수정
      parameters:
        - $ref: "#/components/parameters/WatchlistId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchlistRequest" }
      responses: { "200": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } }
    delete:
      tags: [Watchlists]
      operationId: deleteWatchlist
      summary: 관심종목 목록 삭제
      parameters:
        - $ref: "#/components/parameters/WatchlistId"
      responses: { "204": { description: Deleted }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" } }
  /watchlists/{watchlistId}/items:
    post:
      tags: [Watchlists]
      operationId: addWatchlistItem
      summary: 관심종목 항목 추가
      parameters:
        - $ref: "#/components/parameters/WatchlistId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WatchlistItemRequest" }
      responses: { "201": { $ref: "#/components/responses/GenericSuccess" }, "400": { $ref: "#/components/responses/BadRequest" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } }
  /watchlists/{watchlistId}/items/{country}/{symbol}:
    delete:
      tags: [Watchlists]
      operationId: deleteWatchlistItem
      summary: 관심종목 항목 삭제
      parameters:
        - $ref: "#/components/parameters/WatchlistId"
        - name: country
          in: path
          required: true
          schema: { type: string, enum: [KR, US] }
        - $ref: "#/components/parameters/SymbolPath"
      responses: { "204": { description: Deleted }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: my_wts_session
  parameters:
    SymbolPath:
      name: symbol
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Symbol" }
    SymbolQuery:
      name: symbol
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Symbol" }
    OptionalSymbol:
      name: symbol
      in: query
      schema: { $ref: "#/components/schemas/Symbol" }
    Symbols:
      name: symbols
      in: query
      required: true
      schema:
        type: array
        minItems: 1
        maxItems: 200
        items: { $ref: "#/components/schemas/Symbol" }
      style: form
      explode: false
    HistoryStatus:
      name: status
      in: query
      required: true
      schema: { type: string, enum: [OPEN, CLOSED] }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    WatchlistId:
      name: watchlistId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Symbol:
      type: string
      minLength: 1
      maxLength: 32
      pattern: "^[A-Za-z0-9._-]+$"
    SignupRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32, pattern: "^[A-Za-z0-9._-]+$" }
        displayName: { type: string, minLength: 1, maxLength: 40 }
        password: { type: string, minLength: 10, maxLength: 128, format: password }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        password: { type: string, minLength: 10, maxLength: 128, format: password }
    User:
      type: object
      additionalProperties: false
      required: [id, username, displayName]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
    UserResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user: { $ref: "#/components/schemas/User" }
        meta: { $ref: "#/components/schemas/Meta" }
    SelectAccountRequest:
      type: object
      additionalProperties: false
      required: [accountRef]
      properties:
        accountRef: { type: string, minLength: 16, maxLength: 128 }
    OrderSimulationRequest:
      type: object
      additionalProperties: false
      required: [symbol, side, orderType, timeInForce]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        side: { type: string, enum: [BUY, SELL] }
        orderType: { type: string, enum: [LIMIT, MARKET] }
        timeInForce: { type: string, enum: [DAY, CLS] }
        quantity: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
        orderAmount: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
        price: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
    ConditionalSimulationRequest:
      type: object
      additionalProperties: false
      required: [symbol, type, quantity, orderType, expireDate, first]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        type: { type: string, enum: [SINGLE, OCO, OTO] }
        quantity: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
        orderType: { type: string, enum: [LIMIT, MARKET] }
        expireDate: { type: string, format: date }
        first: { $ref: "#/components/schemas/ConditionLeg" }
        second: { $ref: "#/components/schemas/ConditionLeg" }
    ConditionLeg:
      type: object
      additionalProperties: false
      required: [triggerPrice, side, price]
      properties:
        triggerPrice: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
        side: { type: string, enum: [BUY, SELL] }
        price: { type: string, pattern: "^[0-9]+(\\.[0-9]+)?$" }
    SimulationResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: true
          required: [kind, submitted, persisted]
          properties:
            kind: { type: string, const: SIMULATION_ONLY }
            submitted: { type: boolean, const: false }
            persisted: { type: boolean, const: false }
        meta: { $ref: "#/components/schemas/Meta" }
    WatchlistRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        sortOrder: { type: integer, minimum: 0 }
    WatchlistItemRequest:
      type: object
      additionalProperties: false
      required: [symbol, marketCountry]
      properties:
        symbol: { $ref: "#/components/schemas/Symbol" }
        marketCountry: { type: string, enum: [KR, US] }
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string, format: uuid }
        fetchedAt: { type: string, format: date-time }
        stale: { type: boolean }
        nextCursor: { type: [string, "null"] }
    GenericSuccess:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: true
        meta: { $ref: "#/components/schemas/Meta" }
    ErrorBody:
      type: object
      required: [requestId, code, message, retryable]
      properties:
        requestId: { type: string, format: uuid }
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        details:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorBody" }
  responses:
    GenericSuccess:
      description: Success
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GenericSuccess" }
    UserCreated:
      description: User created and login session established
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UserResponse" }
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Unauthorized:
      description: Login required or invalid credentials
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Forbidden:
      description: Origin or access forbidden
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: State conflict
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    RateLimited:
      description: Rate limited
      headers:
        Retry-After:
          schema: { type: integer, minimum: 0 }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    BadGateway:
      description: Toss upstream failed
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ServiceUnavailable:
      description: Service unavailable
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

